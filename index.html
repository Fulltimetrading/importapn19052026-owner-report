<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сводка номеров по владельцам</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --text:#17202a; --muted:#6b7280; --line:#dfe3e8; --accent:#2563eb; --accent-soft:#dbeafe; --shadow:0 14px 34px rgba(15,23,42,.08); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color:var(--text); background:var(--bg); }
    main { width:min(1120px,calc(100% - 32px)); margin:32px auto; }
    header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0 0 6px; font-size:28px; line-height:1.15; letter-spacing:0; }
    .meta { color:var(--muted); font-size:14px; }
    .stats { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:120px; box-shadow:var(--shadow); }
    .stat b { display:block; font-size:22px; }
    .stat span { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; gap:10px; margin-bottom:12px; }
    input { width:100%; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:15px; background:var(--panel); }
    .table { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); }
    .table-head,.owner-head { display:grid; grid-template-columns:32px minmax(90px,160px) 1fr 72px; align-items:center; gap:12px; }
    .table-head { padding:12px 16px; background:#eef2f7; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; border-bottom:1px solid var(--line); }
    .owner-row + .owner-row { border-top:1px solid var(--line); }
    .owner-head { width:100%; border:0; background:var(--panel); padding:13px 16px; cursor:pointer; color:inherit; font:inherit; text-align:left; }
    .owner-head:hover { background:#f9fafb; }
    .chevron { color:var(--muted); font-size:22px; transition:transform .16s ease; transform-origin:center; }
    .owner-row.open .chevron { transform:rotate(90deg); color:var(--accent); }
    .owner { font-weight:700; }
    .bar { height:8px; border-radius:999px; overflow:hidden; background:#edf0f4; }
    .bar span { display:block; height:100%; border-radius:inherit; background:var(--accent); }
    .count { justify-self:end; min-width:44px; padding:5px 9px; border-radius:999px; background:var(--accent-soft); color:#1d4ed8; font-weight:700; text-align:center; }
    .plates { padding:0 16px 16px 60px; background:#fbfcfe; }
    .plate { display:inline-flex; align-items:center; min-height:30px; margin:8px 8px 0 0; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:14px; font-weight:700; letter-spacing:0; }
    .hidden { display:none; }
    @media (max-width:640px) { main { width:min(100% - 20px,1120px); margin:18px auto; } header { align-items:stretch; flex-direction:column; } .stats { justify-content:stretch; } .stat { flex:1; } .table-head,.owner-head { grid-template-columns:24px minmax(68px,94px) 1fr 54px; gap:8px; } .plates { padding-left:48px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Сводка номеров по владельцам</h1><div class="meta" id="updated-at">Обновлено: —</div></div><div class="stats"><div class="stat"><b id="owners-count">0</b><span>владельцев</span></div><div class="stat"><b id="plates-count">0</b><span>номеров</span></div></div></header>
    <div class="toolbar"><input id="search" type="search" placeholder="Поиск по owner или номеру" autocomplete="off"></div>
    <div class="table"><div class="table-head"><span></span><span>Owner</span><span>Доля</span><span>Номеров</span></div><div id="owner-rows"></div></div>
  </main>
  <script>
    const csvUrl = 'data/importAPN19052026.csv';
    const metaUrl = 'data/importAPN19052026.updated.json';
    const fallbackOwner = '63/2';
    const fallbackPlates = ['A351MC193', 'A357BM193', 'C387Oy193', 'H655KA75', 'O065KP75', 'O524KA75'];
    const rowsContainer = document.getElementById('owner-rows');
    const searchInput = document.getElementById('search');
    let ownerRows = [];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        const next = text[i + 1];
        if (quoted) {
          if (ch === '"' && next === '"') { cell += '"'; i += 1; }
          else if (ch === '"') { quoted = false; }
          else { cell += ch; }
        } else if (ch === '"') { quoted = true; }
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else if (ch !== '\r') { cell += ch; }
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const headers = rows.shift().map((name) => name.replace(/^\uFEFF/, '').trim());
      return rows.filter((items) => items.length && items.some(Boolean)).map((items) => Object.fromEntries(headers.map((name, index) => [name, (items[index] || '').trim()])));
    }

    function ownerKey(owner) {
      const nums = owner.split('/').map((part) => Number(part));
      return nums.every(Number.isFinite) ? nums : [Number.MAX_SAFE_INTEGER, owner];
    }

    function compareOwners(a, b) {
      const ak = ownerKey(a);
      const bk = ownerKey(b);
      const len = Math.max(ak.length, bk.length);
      for (let i = 0; i < len; i += 1) {
        const av = ak[i] ?? -1;
        const bv = bk[i] ?? -1;
        if (av < bv) return -1;
        if (av > bv) return 1;
      }
      return a.localeCompare(b, 'ru');
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    }

    function normalizePlate(plate) {
      const normalized = plate.replace(/[A-Za-z]/g, (ch) => ch.toUpperCase() === 'Y' ? 'y' : ch.toUpperCase());
      return normalized.toUpperCase() === 'P831YKI193' ? 'P831yK193' : normalized;
    }

    function render(records) {
      const groups = new Map();
      for (const record of records) {
        const owner = (record.MasterOfCar || record['Master Of Car'] || '').replaceAll('_', '/').trim();
        const plate = normalizePlate((record.PlateNumber || record['Plate Number'] || '').trim());
        if (!owner || !plate) continue;
        if (!groups.has(owner)) groups.set(owner, []);
        if (!groups.get(owner).some((item) => item.toUpperCase() === plate.toUpperCase())) {
          groups.get(owner).push(plate);
        }
      }
      if (!groups.has(fallbackOwner)) {
        groups.set(fallbackOwner, [...fallbackPlates]);
      }
      const owners = [...groups.keys()].sort(compareOwners);
      const total = [...groups.values()].reduce((sum, plates) => sum + plates.length, 0);
      const maxCount = Math.max(1, ...[...groups.values()].map((plates) => plates.length));
      document.getElementById('owners-count').textContent = owners.length;
      document.getElementById('plates-count').textContent = total;
      rowsContainer.innerHTML = owners.map((owner, index) => {
        const plates = groups.get(owner).sort((a, b) => a.localeCompare(b, 'ru'));
        const count = plates.length;
        const width = Math.max(4, Math.round((count / maxCount) * 1000) / 10);
        const chips = plates.map((plate) => `<span class="plate">${escapeHtml(plate)}</span>`).join('');
        return `<section class="owner-row" data-owner="${escapeHtml(owner)}" data-count="${count}">
          <button class="owner-head" type="button" aria-expanded="false" aria-controls="plates-${index}">
            <span class="chevron">›</span>
            <span class="owner">${escapeHtml(owner)}</span>
            <span class="bar"><span style="width:${width}%"></span></span>
            <span class="count">${count}</span>
          </button>
          <div class="plates" id="plates-${index}" hidden>${chips}</div>
        </section>`;
      }).join('');
      ownerRows = [...document.querySelectorAll('.owner-row')];
      for (const row of ownerRows) {
        const button = row.querySelector('.owner-head');
        const panel = row.querySelector('.plates');
        button.addEventListener('click', () => {
          const open = row.classList.toggle('open');
          panel.hidden = !open;
          button.setAttribute('aria-expanded', String(open));
        });
      }
      filterRows(searchInput.value);
    }

    function filterRows(value) {
      const q = value.trim().toUpperCase();
      for (const row of ownerRows) {
        const text = row.textContent.toUpperCase();
        row.classList.toggle('hidden', q && !text.includes(q));
      }
    }

    searchInput.addEventListener('input', (event) => filterRows(event.target.value));
    fetch(metaUrl, { cache: 'no-store' })
      .then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then((meta) => {
        if (meta.updated_at) {
          document.getElementById('updated-at').textContent = `Обновлено: ${new Date(meta.updated_at).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' })} МСК`;
        }
      })
      .catch(() => {});
    fetch(csvUrl, { cache: 'no-store' })
      .then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.text(); })
      .then((text) => render(parseCsv(text)))
      .catch(() => { rowsContainer.innerHTML = '<section class="owner-row"><div class="plates">Не удалось загрузить данные.</div></section>'; });
  </script>
</body>
</html>
